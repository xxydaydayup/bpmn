# 示例配置；在现有 HTTPS server 中合并这些 location。
# /srv/business/workflow 下放 pnpm build 生成的 dist 内容。
# workflow_authorized_gateway 必须使用当前访问者身份进行授权，不能是管理员引擎直通。
upstream workflow_authorized_gateway {
  server 127.0.0.1:9000;
}

server {
  listen 443 ssl;
  server_name business.example.com;
  ssl_certificate /etc/nginx/tls/business.crt;
  ssl_certificate_key /etc/nginx/tls/business.key;
  root /srv/business;

  location = /workflow { return 308 /workflow/; }

  location ^~ /workflow/api/ {
    proxy_pass http://workflow_authorized_gateway/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  location /workflow/ {
    try_files $uri $uri/ /workflow/index.html;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
  }
}
